name: Desktop Windows checks
on:
  workflow_call:
    inputs:
      sign:
        description: Sign the installer for the auto-updater (release builds only)
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'crates/**', 'tests/**', 'scripts/**', 'public/data/**', 'Cargo.*', 'package*.json', 'vite.config.mjs', '.github/workflows/desktop-*.yml']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'crates/**', 'tests/**', 'scripts/**', 'public/data/**', 'Cargo.*', 'package*.json', 'vite.config.mjs', '.github/workflows/desktop-*.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.1
      - run: npm ci
      - run: ./scripts/desktop/test-metrics.ps1
      - run: npm test
      - run: npm run build
      - name: Prepare native frontend and resource snapshot
        run: npm run build:desktop
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --locked -- -D warnings
      - name: Build unsigned installer
        if: ${{ !inputs.sign }}
        run: npm run desktop:build -- --ci
      - name: Build signed installer and updater signature
        if: ${{ inputs.sign }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --ci --config src-tauri/tauri.updater.conf.json
      - name: Validate installer and resources
        run: ./scripts/desktop/check-artifacts.ps1 -RequireSignature:$${{ inputs.sign && 'true' || 'false' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rift-build-lab-windows
          path: output/desktop-release/*
          if-no-files-found: error
          retention-days: 14
