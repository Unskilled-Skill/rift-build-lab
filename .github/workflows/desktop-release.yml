name: Draft desktop release
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing desktop-v tag to package as a draft release
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/desktop-ci.yml
  draft:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: rift-build-lab-windows
          path: release-files
      - name: Verify version and create draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content release-files/desktop-manifest.json -Raw | ConvertFrom-Json).version
          if($env:RELEASE_TAG -ne "desktop-v$version"){throw 'Release tag does not match packaged application version.'}
          git rev-parse --verify "refs/tags/$env:RELEASE_TAG"
          if($LASTEXITCODE -ne 0){throw 'Tag must already exist.'}
          $tagCommit=git rev-list -n 1 $env:RELEASE_TAG
          if($tagCommit -ne '${{ github.sha }}'){throw 'Selected tag must point at the built commit.'}
          @'
          Windows 10/11 x64 desktop preview. WebView2 is required; the installer checks for it.
          Includes the build browser, item-order/rune UI and opt-in automatic League Client imports.
          Unsigned preview. Live League Client application is not yet verified. Backups are local.
          See the repository's desktop verification and performance reports before relying on auto-import.
          The website remains independently usable without installing this app.
          '@ | Set-Content release-notes.md
          $assets=@(Get-ChildItem -LiteralPath release-files -File | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG --verify-tag --draft --prerelease --title "Rift Build Lab Desktop $version preview" --notes-file release-notes.md @assets
          if($LASTEXITCODE -ne 0){throw 'Draft release failed.'}
