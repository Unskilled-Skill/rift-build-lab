[package]
name = "rbl-core"
version = "0.1.0"
description = "Rift Build Lab native core: validation, League Client integration and data revisions (no UI dependency)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
uuid = { version = "1.28.0", features = ["v4", "v5"] }

[dev-dependencies]
rcgen = "0.14.10"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
