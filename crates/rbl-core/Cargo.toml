[package]
name = "rbl-core"
version = "0.1.0"
description = "Rift Build Lab native core: validation, League Client integration and data revisions (no UI dependency)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v5"] }

[dev-dependencies]
tempfile = "3.27.0"
