[package]
name = "rift-build-lab"
version = "0.1.0"
description = "Rift Build Lab desktop app: build browser with automatic League item and rune imports."
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rbl-core = { path = "../crates/rbl-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
